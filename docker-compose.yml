version: "3.9"
services:
  api:
    image: python:3.10-slim
    working_dir: /app
    volumes:
      - ./backend:/app
    command: sh -c "pip install -r requirements.txt && python run.py"
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/codepath
      - JWT_SECRET_KEY=dev-jwt-secret
      - SECRET_KEY=dev-secret
      - CORS_ORIGINS=http://localhost:5173
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000/api
    depends_on:
      - api

volumes:
  mongo_data:
